<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="styleframe.css"><title>F3 暗场砸字标</title>
<style>
  .f3 { display: grid; place-content: center; justify-items: center; height: 100%; text-align: center; position: relative; }
  .f3 h1 { font-family: var(--display); font-weight: 800; font-size: 210px; letter-spacing: -.04em; line-height: 1; }
  .f3 h1 b { color: var(--night-accent); font-weight: 800; }
  .f3 .rule { width: 460px; height: 6px; margin: 26px auto 22px; background: var(--night-hit-bg); position: relative; overflow: hidden; }
  .f3 .rule i { position: absolute; inset: 0 62% 0 0; background: var(--night-hit-ink); }
  .f3 .zh { font-size: 30px; letter-spacing: .3em; color: #a0a3a8; text-transform: uppercase; }
  .f3 .stats { margin-top: 74px; display: flex; gap: 96px; align-items: flex-start; }
  .f3 .st { text-align: center; min-width: 260px; }
  .f3 .st u { display: block; text-decoration: none; font-family: var(--display); font-weight: 800; font-size: 84px; letter-spacing: -.03em; color: var(--night-ink); line-height: 1; }
  .f3 .st u em { font-style: normal; color: var(--night-hit-ink); }
  .f3 .st span { display: block; margin-top: 14px; font-size: 17px; letter-spacing: .14em; color: #7f8593; }
  .f3 .close { position: absolute; bottom: 84px; left: 0; right: 0; font-size: 15px; color: #566074; letter-spacing: .1em; }
</style></head>
<body><div class="frame night">
  <div class="field"><i></i><i></i><i></i></div>
  <div class="f3">
    <h1>广院<b>通</b></h1>
    <div class="rule"><i></i></div>
    <p class="zh">校园办事向导 · 问一句，给原文</p>
    <div class="stats">
      <div class="st"><u>39222</u><span>条事项</span></div>
      <div class="st"><u>42237</u><span>条引文</span></div>
      <div class="st"><u>0</u><span>条缺证 · 逐字校验</span></div>
    </div>
    <p class="close">中国传媒大学 · 2026 首届智能体节 管理类</p>
  </div>
</div></body></html>
