<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="styleframe.css"><title>F1 暗场开场</title>
<style>
  .f1 { position: relative; height: 100%; padding: 190px 120px 0; }
  .f1 .kicker { margin-bottom: 26px; }
  .f1 h1 { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: -.05em; line-height: 1.04; font-size: 148px; }
  .f1 h1 em { font-style: normal; display: inline-block; padding: 0 .08em .05em; background: var(--night-hit-bg); color: var(--night-hit-ink); }
  /* 本片主角动效的静止态：金底扫到一半，前沿还亮着 */
  .sweep { position: relative; width: 1560px; height: 10px; margin-top: 44px; background: #20242e; overflow: hidden; }
  .sweep i { position: absolute; left: 0; top: 0; bottom: 0; width: 62%; background: var(--night-hit-bg); }
  .sweep b { position: absolute; left: calc(62% - 6px); top: -14px; bottom: -14px; width: 46px; background: linear-gradient(90deg, rgba(255,223,126,0), var(--night-hit-ink) 46%, rgba(255,223,126,0)); filter: blur(1px); }
  .f1 .sub { margin-top: 46px; font-size: 27px; color: #a0a3a8; }
  .f1 .sub b { color: var(--night-ink); font-weight: 700; }
  .f1 .sub .hit { padding: 0 .08em; }
  /* 产品的字幕词表：竖排滚动，取一条压在右侧留白 */
  .reel { position: absolute; right: 120px; top: 210px; width: 420px; text-align: right; font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: -.03em; font-size: 74px; line-height: 1.16; }
  .reel span { display: block; color: #232833; }
  .reel span.on { color: var(--night-accent); }
  .reel span.gold { color: var(--night-hit-ink); }
  .stamp { position: absolute; right: 120px; bottom: 84px; font-family: var(--display); text-transform: uppercase; letter-spacing: .18em; font-size: 18px; color: #566074; }
</style></head>
<body><div class="frame night">
  <div class="field"><i></i><i></i><i></i></div>
  <div class="f1">
    <p class="kicker">CAMPUS SERVICE / VERIFIED SOURCES</p>
    <h1>校园事务<br><em>有求必应</em></h1>
    <div class="sweep"><i></i><b></b></div>
    <p class="sub">每一句事实，都是<span class="hit">官方原文的逐字子串</span>。</p>
    <div class="reel"><span>CUC</span><span class="on">ONE ASK</span><span>ONE VISIT</span><span class="gold">VERIFIED</span></div>
    <p class="stamp">39222 ITEMS · 42237 QUOTES · 0 UNSUPPORTED</p>
  </div>
</div></body></html>
