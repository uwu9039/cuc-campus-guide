<!doctype html>
<html lang="zh-CN" data-theme="cobalt-field">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b5bff">
<link rel="icon" href="data:,">
<title>广院通 · 体测计算器</title>
<link rel="stylesheet" href="field.css">
<link rel="stylesheet" href="tice.css">
</head>
<body class="field tice-page">

<header class="topbar">
  <a class="brand" href="field.html" title="回广院通首页">
    <span class="brand-mark"><img class="brand-emblem" src="assets/cuc-emblem.svg" alt="中国传媒大学校徽" width="34" height="34"></span>
    <span class="brand-text"><b class="brand-name">广院通</b><span class="brand-sub">体测计算器</span></span>
  </a>
  <span class="topline" id="topline" hidden></span>
  <span class="statline" id="statline">国家学生体质健康标准 · 单学年估算</span>
  <nav class="topacts" aria-label="附加功能">
    <a class="ghostbtn" href="field.html">返回</a>
    <button class="themesw" type="button" id="themesw" aria-pressed="false" aria-label="切到夜间模式" title="日夜切换只改这一页的配色，刷新就回到日间。"></button>
  </nav>
</header>

<main class="tice-main">

  <section class="tice-hero">
    <p class="tice-kicker">体测 · 单学年</p>
    <h1 class="tice-h1">体测计算器</h1>
    <p class="tice-lede">七项填完即出总分。</p>
    <p class="tice-disclaimer">评分表来自公开资料，结果仅供参考</p>
  </section>

  <div class="tice-body">

    <div class="tice-left">

      <div class="tice-controls" aria-label="分组">
        <div>
          <span class="tice-label" id="lb-gender">性别</span>
          <div class="tice-seg" id="seg-gender" role="group" aria-labelledby="lb-gender" style="--n:2;--i:0">
            <span class="tice-seg-thumb" aria-hidden="true"></span>
            <button type="button" data-v="male" aria-pressed="true">男</button>
            <button type="button" data-v="female" aria-pressed="false">女</button>
          </div>
        </div>
        <div>
          <span class="tice-label" id="lb-grade">年级</span>
          <div class="tice-seg" id="seg-grade" role="group" aria-labelledby="lb-grade" style="--n:4;--i:0">
            <span class="tice-seg-thumb" aria-hidden="true"></span>
            <button type="button" data-v="大一" aria-pressed="true">大一</button>
            <button type="button" data-v="大二" aria-pressed="false">大二</button>
            <button type="button" data-v="大三" aria-pressed="false">大三</button>
            <button type="button" data-v="大四" aria-pressed="false">大四</button>
          </div>
        </div>
      </div>

      <form class="tice-cards" id="fields" novalidate></form>

      <section class="tice-history" id="history" aria-label="本机记录"></section>

    </div>

    <aside class="tice-result" aria-label="计算结果">
      <div class="tice-score" id="scorecard">
        <div class="tice-total"><b id="total">—</b><span>/ 120 总分</span></div>
        <p class="tice-grade" id="grade">等待填写</p>
        <p class="tice-breakdown" id="breakdown" hidden></p>
        <div class="tice-btns">
          <button class="tice-btn is-primary" type="button" id="calcbtn" disabled>生成结果</button>
          <button class="tice-btn" type="button" id="savebtn">保存本次</button>
        </div>
      </div>
      <p class="tice-note" id="note" hidden></p>
    </aside>

  </div>

  <section class="tice-report" id="report" hidden aria-label="单学年成绩结果"></section>

  <section class="tice-decl-wrap" aria-label="来源与说明">
    <details class="tice-decl" id="declaration">
      <summary class="tice-decl-summary">来源与说明</summary>
      <div class="tice-decl-body" id="declaration-body"></div>
    </details>
  </section>
</main>

<div id="archive-mask" hidden></div>
<aside id="archive-panel" hidden role="dialog" aria-modal="true" aria-labelledby="archive-title"></aside>

<script src="tice-calc.js"></script>
<script src="tice-checks.js"></script>
<script src="tice-store.js"></script>
<script src="tice.js"></script>
</body>
</html>
